# ===================================
# FinFlow — Development Profile
# ===================================

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://localhost:3306/finflow_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: finflow
    password: finflowpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: finflow-dev-pool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 10000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect
        type.preferred_uuid_type: org.hibernate.type.StringUuidType

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: finflow_auth,finflow_accounts,finflow_transactions,finflow_transfers,finflow_savings,finflow_notifications,finflow_profiles,finflow_admin,finflow_settings
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: true
    clean-disabled: true

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 5000ms

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    try-it-out-enabled: true

logging:
  level:
    com.finflow: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# NOTE: In development, secrets can be in application-dev.yml.
# NEVER put real secrets in code control. Use environment variables for staging/production.
finflow:
  jwt:
    secret: ${FINFLOW_JWT_SECRET:dev-only-not-for-production-use-at-all-64-bytes-minimum!!}
    signing-keys:
      primary: ${FINFLOW_JWT_SECRET:dev-only-not-for-production-use-at-all-64-bytes-minimum!!}
    active-key-id: primary
    access-token-expiration-ms: 900000
    clock-skew-ms: 30000
    issuer: finflow
    audience: finflow-api
  session:
    max-active-sessions: 5
    refresh-token-ttl-days: 30
