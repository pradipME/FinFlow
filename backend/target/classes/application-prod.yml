# ===================================
# FinFlow — Production Profile
# ===================================
#
# REQUIRED: SPRING_PROFILES_ACTIVE=prod MUST be set so this profile loads;
# otherwise the default 'dev' profile (base application.yml) is used.
#
# REQUIRED ENVIRONMENT VARIABLES (secrets MUST be provided at runtime):
#
#   FINFLOW_JWT_SECRET          — Base64-encoded or raw string HMAC-SHA512 key (min 64 bytes / 512 bits)
#   DB_USERNAME                 — PostgreSQL database username
#   DB_PASSWORD                 — PostgreSQL database password
#
# OPTIONAL ENVIRONMENT VARIABLES:
#
#   DATABASE_URL                — Full JDBC URL (overrides DB_HOST/DB_PORT/DB_NAME)
#   DB_HOST                     — PostgreSQL host (default: localhost)
#   DB_PORT                     — PostgreSQL port (default: 5432)
#   DB_NAME                     — PostgreSQL database name (default: finflow)
#   REDIS_HOST                  — Redis host (default: localhost)
#   REDIS_PORT                  — Redis port (default: 6379)
#   REDIS_PASSWORD              — Redis authentication password (empty if no auth)
#   REDIS_ENABLED               — Set to false to fully disable Redis (default: true)
#   FINFLOW_JWT_ACTIVE_KEY_ID   — Active signing key ID (default: primary)
#   FRONTEND_URL                — Frontend URL for CORS (default: http://localhost:3000)
#   PORT                        — Render's external port; consumed by the Nginx sidecar (see nginx.conf).
#                                 The Spring Boot process itself always binds the fixed internal port
#                                 defined in `server.port` below to avoid a port collision with Nginx
#                                 in the monolithic image.
#
# KEY ROTATION ENVIRONMENT VARIABLES:
#
#   FINFLOW_JWT_KEY_PREVIOUS    — Previous signing key (for validating tokens signed during rotation)
#
# DO NOT commit real secrets to version control.
# Use a secrets manager (AWS Secrets Manager, HashiCorp Vault, Kubernetes Secrets).

server:
  # Internal HTTP port for the Spring Boot process. In the monolithic image this
  # MUST NOT use ${PORT}, because Nginx binds ${PORT} (Render's external port) for
  # incoming traffic and proxies /api/ to this fixed internal port. Hard-coding it
  # avoids the two processes colliding on the same socket.
  port: 8080
  shutdown: graceful

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finflow}?sslmode=require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: finflow-prod-pool
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 10000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        type.preferred_uuid_type: org.hibernate.type.PostgresUUIDType

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 5000ms

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.finflow: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

finflow:
  jwt:
    secret: ${FINFLOW_JWT_SECRET}
    signing-keys:
      primary: ${FINFLOW_JWT_SECRET}
    active-key-id: ${FINFLOW_JWT_ACTIVE_KEY_ID:primary}
    access-token-expiration-ms: 900000
    clock-skew-ms: 30000
    issuer: finflow
    audience: finflow-api
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  redis:
    enabled: ${REDIS_ENABLED:true}
