# ===================================
# FinFlow — Test Profile
# ===================================

spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:finflow_test;DB_CLOSE_DELAY=-1;MODE=MYSQL;DATABASE_TO_LOWER=TRUE;INIT=RUNSCRIPT FROM 'classpath:schemas.sql'
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      database: 1

  sql:
    init:
      mode: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.finflow: DEBUG
    org.hibernate.SQL: DEBUG

finflow:
  jwt:
    secret: ${FINFLOW_JWT_SECRET:test-secret-key-for-unit-tests-only-minimum-64-bytes!!}
    signing-keys:
      primary: ${FINFLOW_JWT_SECRET:test-secret-key-for-unit-tests-only-minimum-64-bytes!!}
    active-key-id: primary
    access-token-expiration-ms: 900000
    clock-skew-ms: 30000
    issuer: finflow
    audience: finflow-api
